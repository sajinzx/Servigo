name: ci

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # includes the database tests: every migration is applied to an in-process Postgres
      - run: npm test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/ml/requirements.txt
      - run: pip install -r services/ml/requirements.txt
      - name: PostGIS find_candidates() is generated, make sure it is current
        run: python supabase/tools/gen_postgis_find_candidates.py --check
      - name: simulator
        working-directory: data/simulator
        run: python -m pytest -q
      - name: ml service
        working-directory: services/ml
        run: python -m pytest -q
