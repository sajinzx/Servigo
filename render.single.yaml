# One free Render web service that runs the API and the queue worker together
# (RUN_WORKER=true). Use render.yaml instead if you want a separate, always-on worker.
services:
  - type: web
    name: servigo
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build -w apps/api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /ready
    envVars:
      - { key: NODE_VERSION, value: "22" }
      - { key: NODE_ENV, value: production }
      - { key: RUN_WORKER, value: "true" }
      - { key: CORS_ORIGINS, sync: false }
      - { key: SUPABASE_URL, sync: false }
      - { key: SUPABASE_SERVICE_ROLE_KEY, sync: false }
      - { key: SUPABASE_JWKS_URL, sync: false }
      - { key: DATABASE_URL, sync: false }
      - { key: PAYOUT_ENCRYPTION_KEY, sync: false }
      - { key: UPI_PAYEE_ID, sync: false }
      - { key: UPI_PAYEE_NAME, value: ServiGo }
